    RulebookSection:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        category:
          type: string
        level:
          type: integer
          description: Heading depth in the source PDF (1 = top-level chapter, 2 = section, 3 = sub-section).
        paragraphs:
          type: array
          description: >-
            Section text preserved as the paragraph chunks emitted by the
            source PDF (par_rulebook_en.pdf). We deliberately keep this as an
            array (rather than a single `body` blob) so search snippet
            extraction and rendering can operate on the original paragraph
            boundaries without re-segmenting on every request.
          items:
            type: string
      required: [id, title, category, level, paragraphs]

