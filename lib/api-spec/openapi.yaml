openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: DexPoky API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: assistant
    description: Typed Jev assistant with closed actions and confirmation-gated changes
  - name: health
    description: Health operations
  - name: cards
    description: Pokemon card operations
  - name: categories
    description: Card category operations
  - name: collections
    description: User-owned card collection operations
  - name: marketplace
    description: Marketplace listing operations
  - name: inventory
    description: Inventory stats and tracking
  - name: pokemon
    description: Pokemon reference data lookup
  - name: storage
    description: Object storage operations
  - name: decks
    description: Deck builder operations
  - name: rules
    description: Pokémon TCG rulebook lookup and search
  - name: catalog
    description: PokeWallet card catalog search and lookup
  - name: wishlist
    description: Wishlist of catalog cards the user is looking for
  - name: messages
    description: In-app direct messaging between buyers and sellers
  - name: wanted
    description: Public "Looking For" requests from buyers
  - name: outreach
    description: Agentic outreach — send Pokémon-card-styled invite emails and SMS to non-DexPoky users
  - name: links
    description: Build canonical and short URLs for shareable DexPoky pages
  - name: agents
    description: DexAgent autonomous trading agents and Tempo wallet operations
  - name: trust
    description: Privacy-safe trust signals and private transaction report triage

paths:
  /ratings/user/{clerkId}/trust:
    get:
      operationId: getUserTrustSignals
      tags: [trust]
      summary: Get privacy-safe aggregate reliability signals for a profile
      parameters:
        - name: clerkId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Aggregate trust dimensions with evidence and uncertainty
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrustSignalResult" }

  /reports:
    post:
      operationId: createDisputeReport
      tags: [trust]
      summary: Create and privately triage a transaction problem for human review
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DisputeReportInput" }
      responses:
        "201":
          description: Private report created and routed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DisputeTriageResult" }
        "403":
          description: Reporter is not a transaction participant
        "404":
          description: Transaction not found

  /agents/tempo-onramp-session:
    post:
      tags: [agents]
      operationId: createTempoOnrampSession
      summary: Create a Stripe Crypto Onramp session to fund the user's Tempo wallet with fiat
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Onramp session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TempoOnrampSession'
        '400':
          description: Stripe publishable key not available.
        '500':
          description: Failed to create onramp session.

  /outreach/invite:
    post:
      tags: [outreach]
      operationId: sendInvite
      summary: Send a Pokémon-card-styled invite email and/or SMS to a non-DexPoky user
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendInviteBody'
      responses:
        '201':
          description: Invite sent successfully on at least one channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteResult'
        '400':
          description: Invalid request body.
        '429':
          description: Rate limit exceeded (30 invites per 24 hours per API key).
        '502':
          description: All delivery channels failed.

  /outreach/invites:
    get:
      tags: [outreach]
      operationId: listInvites
      summary: List the last 100 invites sent by the current API key
      security:
        - apiKey: []
      responses:
        '200':
          description: Invite history list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InviteHistoryEntry'

  /links/build:
    post:
      tags: [links]
      operationId: buildLink
      summary: Build a canonical URL and short URL for any shareable DexPoky page
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildLinkBody'
      responses:
        '200':
          description: Canonical and short URL for the requested page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuiltLink'
        '400':
          description: Invalid request body.

  /storage/uploads/request-url:
    post:
      tags: [storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /storage/objects/{objectPath}:
    get:
      tags: [storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /cards/lookup:
    get:
      operationId: lookupCards
      tags: [cards]
      summary: Look up Pokémon card printings for the scanner
      description: >-
        Public legacy lookup requests omit scanner selection and do not make a
        model request. Setting resolvePrinting=true enables scanner printing
        selection, requires authentication, and may invoke the selection model.
        The selection field is only returned for those selection-enabled
        requests. Valid model judgments order available printings best-first
        without overriding known name or identifier conflicts. An uncertain
        top preview still requires review and is not a confident recommendation.
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
        - name: cardNumber
          in: query
          required: false
          schema:
            type: string
        - name: setCode
          in: query
          required: false
          schema:
            type: string
        - name: resolvePrinting
          in: query
          required: false
          description: Set to true to request authenticated scanner printing selection.
          schema:
            type: boolean
            default: false
        - name: visionConfidence
          in: query
          required: false
          schema:
            type: string
            enum: [high, medium, low]
        - name: visualSummary
          in: query
          required: false
          schema:
            type: string
            maxLength: 1000
        - name: hp
          in: query
          required: false
          schema:
            type: number
      responses:
        "200":
          description: >-
            Matching card, variants, pricing, and freshness. When
            resolvePrinting=true, also includes scanner selection assessment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanLookupResponse"
        "400":
          description: Invalid or missing lookup query parameters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication is required only when resolvePrinting=true.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /cards:
    get:
      operationId: listCards
      tags: [cards]
      summary: List all cards in the collection
      parameters:
        - name: categoryId
          in: query
          required: false
          schema:
            type: integer
        - name: forSale
          in: query
          required: false
          schema:
            type: boolean
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: rarity
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of cards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Card"
    post:
      operationId: createCard
      tags: [cards]
      summary: Add a new card to collection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCardBody"
      responses:
        "201":
          description: Created card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"

  /cards/{id}:
    get:
      operationId: getCard
      tags: [cards]
      summary: Get a single card
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "404":
          description: Not found
    put:
      operationId: updateCard
      tags: [cards]
      summary: Update a card
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCardBody"
      responses:
        "200":
          description: Updated card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
    delete:
      operationId: deleteCard
      tags: [cards]
      summary: Delete a card from collection
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /cards/confidence:
    post:
      operationId: scoreCardConfidence
      tags: [cards]
      summary: Score ephemeral card evidence across four independent dimensions
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CardConfidenceInput" }
      responses:
        "200":
          description: Evidence confidence scorecard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardConfidenceResult" }
        "400": { description: Invalid evidence }

  /cards/{id}/confidence:
    post:
      operationId: scoreOwnedCardConfidence
      tags: [cards]
      summary: Score an owned card using server-derived identity and pricing
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Evidence confidence scorecard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardConfidenceResult" }
        "403": { description: Not owned by current user }

  /collections:
    get:
      operationId: listCollections
      tags: [collections]
      summary: List the current user's collections
      responses:
        "200":
          description: Collections with owned-card counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Collection"
    post:
      operationId: createCollection
      tags: [collections]
      summary: Create a collection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionInput"
      responses:
        "201":
          description: Created collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"

  /collections/{id}:
    get:
      operationId: getCollection
      tags: [collections]
      summary: Get a collection and its owned-card count
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Collection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "404": { description: Not found }
    put:
      operationId: updateCollection
      tags: [collections]
      summary: Update a collection
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectionUpdate" }
      responses:
        "200":
          description: Updated collection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
    delete:
      operationId: deleteCollection
      tags: [collections]
      summary: Delete a collection without deleting its cards
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Deleted }

  /cards/bulk:
    post:
      operationId: bulkCreateCards
      tags: [cards]
      summary: Add selected set cards as owned cards atomically
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkCreateCardsInput" }
      responses:
        "201":
          description: Created cards and deterministic skips
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkCreateCardsResponse" }

  /cards/bulk-update:
    put:
      operationId: bulkUpdateCards
      tags: [cards]
      summary: Update selected owned cards
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkUpdateCardsInput" }
      responses:
        "200":
          description: Updated cards
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkUpdateCardsResponse" }

  /cards/reprice:
    post:
      operationId: repriceOwnedCards
      tags: [cards]
      summary: Repair the authenticated user's collection values using exact-printing prices
      responses:
        "200":
          description: Repricing result counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepriceOwnedCardsResponse" }

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all card categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createCategory
      tags: [categories]
      summary: Create a new category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryBody"
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  /categories/{id}:
    get:
      operationId: getCategory
      tags: [categories]
      summary: Get a single category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
    put:
      operationId: updateCategory
      tags: [categories]
      summary: Update a category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategoryBody"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
    delete:
      operationId: deleteCategory
      tags: [categories]
      summary: Delete a category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /marketplace:
    get:
      operationId: listListings
      tags: [marketplace]
      summary: List all active marketplace listings
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, sold, cancelled]
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: minPrice
          in: query
          required: false
          schema:
            type: number
        - name: maxPrice
          in: query
          required: false
          schema:
            type: number
      responses:
        "200":
          description: List of listings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Listing"
    post:
      operationId: createListing
      tags: [marketplace]
      summary: Create a new listing to sell a card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateListingBody"
      responses:
        "201":
          description: Created listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"

  /marketplace/review:
    post:
      operationId: reviewListingDraft
      tags: [marketplace]
      summary: Review a sale or auction draft before publishing
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateListingBody"
      responses:
        "200":
          description: Listing quality review and code-owned publication decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingQualityReview"
        "403":
          description: Card is not owned by current user

  /marketplace/{id}:
    get:
      operationId: getListing
      tags: [marketplace]
      summary: Get a single marketplace listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
    put:
      operationId: updateListing
      tags: [marketplace]
      summary: Update a listing (e.g. mark as sold, cancel)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateListingBody"
      responses:
        "200":
          description: Updated listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
    delete:
      operationId: deleteListing
      tags: [marketplace]
      summary: Remove a listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /inventory/stats:
    get:
      operationId: getInventoryStats
      tags: [inventory]
      summary: Get inventory summary stats
      responses:
        "200":
          description: Inventory statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryStats"

  /inventory/value-by-category:
    get:
      operationId: getValueByCategory
      tags: [inventory]
      summary: Get total estimated value grouped by category
      responses:
        "200":
          description: Value breakdown by category
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryValue"

  /inventory/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [inventory]
      summary: Get recently added cards
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Recent cards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Card"

  /pokemon/search:
    get:
      operationId: searchPokemon
      tags: [pokemon]
      summary: Search for Pokemon by name for card identification
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Pokemon search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PokemonResult"

  /pokemon/sets:
    get:
      operationId: listPokemonSets
      tags: [pokemon]
      summary: List all Pokemon TCG sets
      responses:
        "200":
          description: Pokemon TCG sets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PokemonSetSummary"

  /pokemon/sets/{id}:
    get:
      operationId: getPokemonSet
      tags: [pokemon]
      summary: Get a Pokemon TCG set and its cards
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Pokemon TCG set detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PokemonSetDetail"
        "404":
          description: Set not found

  /decks:
    get:
      operationId: listDecks
      tags: [decks]
      summary: List the signed-in user's decks
      responses:
        "200":
          description: List of decks (with card counts)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeckSummary"
    post:
      operationId: createDeck
      tags: [decks]
      summary: Create a new deck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeckBody"
      responses:
        "201":
          description: Created deck
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deck"

  /decks/{id}:
    get:
      operationId: getDeck
      tags: [decks]
      summary: Get a deck with its cards
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deck with cards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeckWithCards"
        "404":
          description: Not found
    put:
      operationId: updateDeck
      tags: [decks]
      summary: Update a deck's metadata
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDeckBody"
      responses:
        "200":
          description: Updated deck
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deck"
    delete:
      operationId: deleteDeck
      tags: [decks]
      summary: Delete a deck
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /decks/{id}/cards:
    post:
      operationId: addDeckCard
      tags: [decks]
      summary: Add a card to a deck (or increment count)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddDeckCardBody"
      responses:
        "201":
          description: Card added or count incremented
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeckWithCards"

  /decks/{id}/cards/{cardId}:
    delete:
      operationId: removeDeckCard
      tags: [decks]
      summary: Remove a card from a deck
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: cardId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  /decks/suggest:
    post:
      operationId: suggestDeck
      tags: [decks]
      summary: AI-suggest a deck composition from the user's collection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuggestDeckBody"
      responses:
        "200":
          description: AI deck suggestion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestDeckResponse"

  /catalog/search:
    get:
      operationId: searchCatalog
      tags: [catalog]
      summary: Search the manual card catalog by name, including supplemental TCGCSV printings
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Catalog search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogSearchResponse"

  /catalog/cards/{id}:
    get:
      operationId: getCatalogCard
      tags: [catalog]
      summary: Get a single catalog card by provider ID, including TCGCSV IDs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Catalog card with pricing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogCardDetail"
        "404":
          description: Card not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /wishlist:
    get:
      operationId: listWishlist
      tags: [wishlist]
      summary: List the signed-in user's wishlist items
      responses:
        "200":
          description: Wishlist items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WishlistItem"
    post:
      operationId: addWishlistItem
      tags: [wishlist]
      summary: Add a catalog card to the wishlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddWishlistBody"
      responses:
        "201":
          description: Created wishlist item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WishlistItem"

  /wishlist/{id}:
    put:
      operationId: updateWishlistItem
      tags: [wishlist]
      summary: Update wishlist priority or notes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWishlistBody"
      responses:
        "200":
          description: Updated wishlist item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WishlistItem"
    delete:
      operationId: removeWishlistItem
      tags: [wishlist]
      summary: Remove a wishlist item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  /wanted:
    get:
      operationId: listWantedListings
      tags: [wanted]
      summary: List all active wanted listings
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of wanted listings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WantedListing"
    post:
      operationId: createWantedListing
      tags: [wanted]
      summary: Post a card you are looking for
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWantedBody"
      responses:
        "201":
          description: Created wanted listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WantedListing"

  /wanted/mine:
    get:
      operationId: listMyWantedListings
      tags: [wanted]
      summary: List all wanted listings owned by the signed-in user (all statuses)
      responses:
        "200":
          description: List of wanted listings belonging to the current user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WantedListing"
        "401":
          description: Unauthorized

  /wanted/by-code/{code}:
    get:
      operationId: getWantedListingByCode
      tags: [wanted]
      summary: Get a single wanted listing by its short code (public)
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Wanted listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WantedListing"
        "404":
          description: Not found

  /wanted/{id}:
    patch:
      operationId: updateWantedListing
      tags: [wanted]
      summary: Update your own wanted listing (e.g. mark as found/closed)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWantedBody"
      responses:
        "200":
          description: Updated wanted listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WantedListing"
        "403":
          description: Forbidden
        "404":
          description: Not found
    delete:
      operationId: deleteWantedListing
      tags: [wanted]
      summary: Remove your own wanted listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /wanted/{id}/matches:
    get:
      operationId: listWantedMatches
      tags: [wanted]
      summary: List eligible marketplace matches ranked by the buyer's preferences
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Ranked eligible matches
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WantedMatch" }
        "403": { description: Forbidden }

  /wanted/{id}/thread:
    post:
      operationId: startThread
      tags: [messages]
      summary: Start or retrieve an existing DM thread for a wanted listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartThreadBody'
      responses:
        "200":
          description: Existing or newly created thread
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DmThread'
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "403":
          description: Forbidden (owner cannot message themselves)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "404":
          description: Wanted listing not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /threads:
    get:
      operationId: listThreads
      tags: [messages]
      summary: List all DM threads for the current user
      responses:
        "200":
          description: List of threads with metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DmThreadSummary'

  /threads/{threadId}/messages:
    get:
      operationId: listThreadMessages
      tags: [messages]
      summary: Get all messages in a thread
      parameters:
        - name: threadId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DmMessage'
        "403":
          description: Not a participant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "404":
          description: Thread not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send a message in a thread
      parameters:
        - name: threadId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageBody'
      responses:
        "201":
          description: Sent message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DmMessage'
        "403":
          description: Not a participant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "404":
          description: Thread not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /threads/{threadId}/offer/coach:
    get:
      operationId: getTradeCoach
      tags: [messages]
      summary: Review the current trade offer with exact facts and neutral DexPoky judgments
      security:
        - bearerAuth: []
      parameters:
        - name: threadId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deterministic trade facts and four independent coach judgments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeCoachResult'
        "404":
          description: Thread or offer not found, or the user is not a participant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /threads/{threadId}/read:
    post:
      operationId: markThreadRead
      tags: [messages]
      summary: Mark all messages in a thread as read for the current user
      parameters:
        - name: threadId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Marked as read
        "403":
          description: Not a participant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "404":
          description: Thread not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /rules:
    get:
      operationId: getRulebook
      tags: [rules]
      summary: Get the full Pokémon TCG rulebook (sections + glossary)
      responses:
        "200":
          description: Rulebook data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RulebookResponse"

  /rules/search:
    get:
      operationId: searchRulebook
      tags: [rules]
      summary: Search the rulebook by free-text query
      description: |
        Returns ranked rulebook hits matching the query. Queries shorter than
        2 characters (or missing entirely) return an empty array rather than
        a validation error so the client can call this hook unconditionally.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Ranked search results (empty when q is missing or shorter than 2 characters)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RulebookSearchResult"

  /recommendations/opportunities:
    get:
      tags: [recommendations]
      summary: Get ranked owned-card opportunities
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: profile
          schema:
            type: string
            enum: [collector, player, seller, trader, investor]
      responses:
        "200":
          description: Ranked informational recommendations
          content:
            application/json:
              schema:
                type: object
                required: [profile, opportunities, informational]
                properties:
                  profile: { type: string }
                  informational: { type: boolean }
                  opportunities: { type: array, items: { $ref: "#/components/schemas/Recommendation" } }
  /cards/{id}/recommendations:
    get:
      tags: [recommendations]
      summary: Recommend actions for one owned card
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: query
          name: profile
          schema: { type: string, enum: [collector, player, seller, trader, investor] }
      responses:
        "200":
          description: Informational recommendations
          content:
            application/json:
              schema:
                type: object
                required: [card, profile, recommendations, informational, evidenceHash, unavailable]
                properties:
                  card: { $ref: "#/components/schemas/RecommendationCard" }
                  profile: { type: string, enum: [collector, player, seller, trader, investor] }
                  recommendations:
                    type: array
                    items: { $ref: "#/components/schemas/Recommendation" }
                  informational: { type: boolean }
                  evidenceHash: { type: string }
                  unavailable: { type: boolean }
        "400": { description: Invalid card id }
        "404": { description: Owned card not found }
  /recommendations/{key}/feedback:
    post:
      tags: [recommendations]
      summary: Save feedback for a recommendation
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { type: string, enum: [dismissed, helpful, not_helpful] }
      responses:
        "201": { description: Feedback saved }
        "400": { description: Invalid feedback }

  /assistant/message:
    post:
      operationId: sendAssistantMessage
      tags: [assistant]
      summary: Route one natural-language request to a registered DexPoky action
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantMessageBody"
      responses:
        "200":
          description: Read result, focused clarification, or mutation preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "503":
          description: Jev is temporarily unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantResponse" }

  /assistant/confirm:
    post:
      operationId: confirmAssistantAction
      tags: [assistant]
      summary: Confirm and execute a short-lived assistant mutation preview
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantConfirmBody"
      responses:
        "200":
          description: Confirmed action completed after current-state authorization checks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantResponse"
        "400":
          description: Invalid or expired confirmation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404":
          description: Target record no longer exists or is no longer owned by the user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: Target record is no longer in a valid state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AssistantMessageBody:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          minLength: 2
          maxLength: 1000
        continuationToken:
          type: string

    AssistantConfirmBody:
      type: object
      additionalProperties: false
      required: [confirmationToken]
      properties:
        confirmationToken:
          type: string

    AssistantResponse:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          enum: [result, clarification, confirmation, completed]
        action:
          type: string
          enum:
            - find_duplicates
            - search_collection
            - search_marketplace
            - find_trade_opportunities
            - list_wanted
            - inspect_wanted_matches
            - list_decks
            - inspect_deck
            - add_card_to_deck
            - update_wanted_budget
            - close_wanted
        summary:
          type: string
        message:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        unavailable:
          type: boolean
        confirmationToken:
          type: string
        continuationToken:
          type: string
        expiresInSeconds:
          type: integer
        data:
          description: Action-specific, server-validated result data

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Card:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        pokemonName:
          type: string
        setName:
          type: string
        setId:
          type: string
          nullable: true
        cardNumber:
          type: string
        rarity:
          type: string
          enum: [common, uncommon, rare, holo_rare, ultra_rare, secret_rare, promo]
        condition:
          type: string
          enum: [mint, near_mint, excellent, good, light_played, played, poor]
        imageUrl:
          type: string
          nullable: true
        originalScanUrl:
          type: string
          nullable: true
        catalogCardId:
          type: string
          nullable: true
        estimatedValue:
          type: number
          nullable: true
        acquiredDate:
          type: string
          format: date-time
          nullable: true
        categoryId:
          type: integer
          nullable: true
        collectionId:
          type: integer
          nullable: true
        categoryName:
          type: string
          nullable: true
        forSale:
          type: boolean
        listingPrice:
          type: number
          nullable: true
        notes:
          type: string
          nullable: true
        cardStory:
          type: string
          nullable: true
        agentAcquiredAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - pokemonName
        - rarity
        - condition
        - forSale
        - createdAt
        - updatedAt

    CreateCardBody:
      type: object
      properties:
        name:
          type: string
        pokemonName:
          type: string
        setName:
          type: string
        setId:
          type: string
          nullable: true
        cardNumber:
          type: string
        rarity:
          type: string
          enum: [common, uncommon, rare, holo_rare, ultra_rare, secret_rare, promo]
        condition:
          type: string
          enum: [mint, near_mint, excellent, good, light_played, played, poor]
        imageUrl:
          type: string
          nullable: true
        originalScanUrl:
          type: string
          nullable: true
        catalogCardId:
          type: string
          nullable: true
        estimatedValue:
          type: number
          nullable: true
        acquiredDate:
          type: string
          format: date-time
          nullable: true
        categoryId:
          type: integer
          nullable: true
        collectionId:
          type: integer
          nullable: true
        forSale:
          type: boolean
        listingPrice:
          type: number
          nullable: true
        notes:
          type: string
          nullable: true
        cardStory:
          type: string
          nullable: true
      required:
        - name
        - pokemonName
        - rarity
        - condition
        - forSale

    UpdateCardBody:
      type: object
      properties:
        name:
          type: string
        pokemonName:
          type: string
        setName:
          type: string
        setId:
          type: string
          nullable: true
        cardNumber:
          type: string
        rarity:
          type: string
          enum: [common, uncommon, rare, holo_rare, ultra_rare, secret_rare, promo]
        condition:
          type: string
          enum: [mint, near_mint, excellent, good, light_played, played, poor]
        imageUrl:
          type: string
          nullable: true
        originalScanUrl:
          type: string
          nullable: true
        catalogCardId:
          type: string
          nullable: true
        estimatedValue:
          type: number
          nullable: true
        acquiredDate:
          type: string
          format: date-time
          nullable: true
        categoryId:
          type: integer
          nullable: true
        collectionId:
          type: integer
          nullable: true
        forSale:
          type: boolean
        listingPrice:
          type: number
          nullable: true
        notes:
          type: string
          nullable: true
        cardStory:
          type: string
          nullable: true

    Collection:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        cardCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, name, cardCount, createdAt, updatedAt]

    CollectionInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string, nullable: true }

    CollectionUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string, nullable: true }

    BulkCreateCardInput:
      type: object
      required: [catalogCardId, name, setName, setId, cardNumber, rarity, imageUrl]
      properties:
        catalogCardId: { type: string }
        name: { type: string }
        setName: { type: string }
        setId: { type: string }
        cardNumber: { type: string }
        rarity:
          type: string
          enum: [common, uncommon, rare, holo_rare, ultra_rare, secret_rare, promo]
        imageUrl: { type: string, nullable: true }
        estimatedValue: { type: number, minimum: 0, maximum: 99999999.99, nullable: true }
        originalScanUrl: { type: string, nullable: true }
        collectionId: { type: integer, nullable: true }
        condition:
          type: string
          enum: [mint, near_mint, excellent, good, light_played, played, poor]
          default: near_mint

    BulkCreateCardsInput:
      type: object
      required: [cards]
      properties:
        cards:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/BulkCreateCardInput" }

    BulkCreateCardsResponse:
      type: object
      properties:
        created:
          type: array
          items: { $ref: "#/components/schemas/Card" }
        skipped:
          type: array
          items:
            type: object
            properties:
              setId: { type: string }
              cardNumber: { type: string }
              reason: { type: string }
            required: [setId, cardNumber, reason]
      required: [created, skipped]

    BulkUpdateCardsInput:
      type: object
      required: [cardIds]
      properties:
        cardIds:
          type: array
          minItems: 1
          items: { type: integer }
        collectionId: { type: integer, nullable: true }
        condition:
          type: string
          enum: [mint, near_mint, excellent, good, light_played, played, poor]
        estimatedValue: { type: number, minimum: 0, maximum: 99999999.99, nullable: true }

    BulkUpdateCardsResponse:
      type: object
      properties:
        updated:
          type: array
          items: { $ref: "#/components/schemas/Card" }
        count: { type: integer }
      required: [updated, count]

    RepriceOwnedCardsResponse:
      type: object
      properties:
        corrected: { type: integer }
        unchanged: { type: integer }
        unresolved: { type: integer }
        unavailable: { type: integer }
        total: { type: integer }
      required: [corrected, unchanged, unresolved, unavailable, total]

    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        cardCount:
          type: integer
        totalValue:
          type: number
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - cardCount
        - totalValue
        - createdAt

    CreateCategoryBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
      required:
        - name

    UpdateCategoryBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        color:
          type: string
          nullable: true

    Listing:
      type: object
      properties:
        id:
          type: integer
        cardId:
          type: integer
        card:
          $ref: "#/components/schemas/Card"
        price:
          type: number
        status:
          type: string
          enum: [active, sold, cancelled]
        description:
          type: string
          nullable: true
        listingImages:
          type: array
          items:
            type: string
          nullable: true
