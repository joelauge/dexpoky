openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: DexPoky API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: cards
    description: Pokemon card operations
  - name: categories
    description: Card category operations
  - name: marketplace
    description: Marketplace listing operations
  - name: inventory
    description: Inventory stats and tracking
  - name: pokemon
    description: Pokemon reference data lookup
  - name: storage
    description: Object storage operations
  - name: decks
    description: Deck builder operations
  - name: rules
    description: Pokémon TCG rulebook lookup and search
  - name: catalog
    description: PokeWallet card catalog search and lookup
  - name: wishlist
    description: Wishlist of catalog cards the user is looking for

paths:
  /storage/uploads/request-url:
    post:
      tags: [storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /storage/objects/{objectPath}:
    get:
      tags: [storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /cards:
    get:
      operationId: listCards
      tags: [cards]
      summary: List all cards in the collection
      parameters:
        - name: categoryId
          in: query
          required: false
          schema:
            type: integer
        - name: forSale
          in: query
          required: false
          schema:
            type: boolean
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: rarity
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of cards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Card"
    post:
      operationId: createCard
      tags: [cards]
      summary: Add a new card to collection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCardBody"
      responses:
        "201":
          description: Created card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"

  /cards/{id}:
    get:
      operationId: getCard
      tags: [cards]
      summary: Get a single card
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "404":
          description: Not found
    put:
      operationId: updateCard
      tags: [cards]
      summary: Update a card
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCardBody"
      responses:
        "200":
          description: Updated card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
    delete:
      operationId: deleteCard
      tags: [cards]
      summary: Delete a card from collection
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all card categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createCategory
      tags: [categories]
      summary: Create a new category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryBody"
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  /categories/{id}:
    get:
      operationId: getCategory
      tags: [categories]
      summary: Get a single category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
    put:
      operationId: updateCategory
      tags: [categories]
      summary: Update a category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategoryBody"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
    delete:
      operationId: deleteCategory
      tags: [categories]
      summary: Delete a category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /marketplace:
    get:
      operationId: listListings
      tags: [marketplace]
      summary: List all active marketplace listings
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, sold, cancelled]
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: minPrice
          in: query
          required: false
          schema:
            type: number
        - name: maxPrice
          in: query
          required: false
          schema:
            type: number
      responses:
        "200":
          description: List of listings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Listing"
    post:
      operationId: createListing
      tags: [marketplace]
      summary: Create a new listing to sell a card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateListingBody"
      responses:
        "201":
          description: Created listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"

  /marketplace/{id}:
    get:
      operationId: getListing
      tags: [marketplace]
      summary: Get a single marketplace listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
    put:
      operationId: updateListing
      tags: [marketplace]
      summary: Update a listing (e.g. mark as sold, cancel)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateListingBody"
      responses:
        "200":
          description: Updated listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
    delete:
      operationId: deleteListing
      tags: [marketplace]
      summary: Remove a listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /inventory/stats:
    get:
      operationId: getInventoryStats
      tags: [inventory]
      summary: Get inventory summary stats
      responses:
        "200":
          description: Inventory statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryStats"

  /inventory/value-by-category:
    get:
      operationId: getValueByCategory
      tags: [inventory]
      summary: Get total estimated value grouped by category
      responses:
        "200":
          description: Value breakdown by category
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryValue"

  /inventory/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [inventory]
      summary: Get recently added cards
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Recent cards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Card"

  /pokemon/search:
    get:
      operationId: searchPokemon
      tags: [pokemon]
      summary: Search for Pokemon by name for card identification
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Pokemon search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PokemonResult"

  /decks:
    get:
      operationId: listDecks
      tags: [decks]
      summary: List the signed-in user's decks
      responses:
        "200":
          description: List of decks (with card counts)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeckSummary"
    post:
      operationId: createDeck
      tags: [decks]
      summary: Create a new deck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeckBody"
      responses:
        "201":
          description: Created deck
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deck"

  /decks/{id}:
    get:
      operationId: getDeck
      tags: [decks]
      summary: Get a deck with its cards
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deck with cards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeckWithCards"
        "404":
          description: Not found
    put:
      operationId: updateDeck
      tags: [decks]
      summary: Update a deck's metadata
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDeckBody"
      responses:
        "200":
          description: Updated deck
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deck"
    delete:
      operationId: deleteDeck
      tags: [decks]
      summary: Delete a deck
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /decks/{id}/cards:
    post:
      operationId: addDeckCard
      tags: [decks]
      summary: Add a card to a deck (or increment count)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddDeckCardBody"
      responses:
        "201":
          description: Card added or count incremented
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeckWithCards"

  /decks/{id}/cards/{cardId}:
    delete:
      operationId: removeDeckCard
      tags: [decks]
      summary: Remove a card from a deck
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: cardId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  /decks/suggest:
    post:
      operationId: suggestDeck
      tags: [decks]
      summary: AI-suggest a deck composition from the user's collection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuggestDeckBody"
      responses:
        "200":
          description: AI deck suggestion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestDeckResponse"

  /catalog/search:
    get:
      operationId: searchCatalog
      tags: [catalog]
      summary: Search the PokeWallet card catalog by name
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Catalog search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogSearchResponse"

  /catalog/cards/{id}:
    get:
      operationId: getCatalogCard
      tags: [catalog]
      summary: Get a single catalog card by PokeWallet id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Catalog card with pricing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogCardDetail"
        "404":
          description: Card not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /wishlist:
    get:
      operationId: listWishlist
      tags: [wishlist]
      summary: List the signed-in user's wishlist items
      responses:
        "200":
          description: Wishlist items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WishlistItem"
    post:
      operationId: addWishlistItem
      tags: [wishlist]
      summary: Add a catalog card to the wishlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddWishlistBody"
      responses:
        "201":
          description: Created wishlist item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WishlistItem"

  /wishlist/{id}:
    put:
      operationId: updateWishlistItem
      tags: [wishlist]
      summary: Update wishlist priority or notes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWishlistBody"
      responses:
        "200":
          description: Updated wishlist item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WishlistItem"
    delete:
      operationId: removeWishlistItem
      tags: [wishlist]
      summary: Remove a wishlist item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  /rules:
    get:
      operationId: getRulebook
      tags: [rules]
      summary: Get the full Pokémon TCG rulebook (sections + glossary)
      responses:
        "200":
          description: Rulebook data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RulebookResponse"

  /rules/search:
    get:
      operationId: searchRulebook
      tags: [rules]
      summary: Search the rulebook by free-text query
      description: |
        Returns ranked rulebook hits matching the query. Queries shorter than
        2 characters (or missing entirely) return an empty array rather than
        a validation error so the client can call this hook unconditionally.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Ranked search results (empty when q is missing or shorter than 2 characters)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RulebookSearchResult"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Card:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        pokemonName:
          type: string
        setName:
          type: string
        cardNumber:
          type: string
        rarity:
          type: string
          enum: [common, uncommon, rare, holo_rare, ultra_rare, secret_rare, promo]
        condition:
          type: string
          enum: [mint, near_mint, excellent, good, light_played, played, poor]
        imageUrl:
          type: string
          nullable: true
        originalScanUrl:
          type: string
          nullable: true
        catalogCardId:
          type: string
          nullable: true
        estimatedValue:
          type: number
          nullable: true
        acquiredDate:
          type: string
          format: date-time
          nullable: true
        categoryId:
          type: integer
          nullable: true
        categoryName:
          type: string
          nullable: true
        forSale:
          type: boolean
        listingPrice:
          type: number
          nullable: true
        notes:
          type: string
          nullable: true
        cardStory:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - pokemonName
        - rarity
        - condition
        - forSale
        - createdAt
        - updatedAt

    CreateCardBody:
      type: object
      properties:
        name:
          type: string
        pokemonName:
          type: string
        setName:
          type: string
        cardNumber:
          type: string
        rarity:
          type: string
          enum: [common, uncommon, rare, holo_rare, ultra_rare, secret_rare, promo]
        condition:
          type: string
          enum: [mint, near_mint, excellent, good, light_played, played, poor]
        imageUrl:
          type: string
          nullable: true
        originalScanUrl:
          type: string
          nullable: true
        catalogCardId:
          type: string
          nullable: true
        estimatedValue:
          type: number
          nullable: true
        acquiredDate:
          type: string
          format: date-time
          nullable: true
        categoryId:
          type: integer
          nullable: true
        forSale:
          type: boolean
        listingPrice:
          type: number
          nullable: true
        notes:
          type: string
          nullable: true
        cardStory:
          type: string
          nullable: true
      required:
        - name
        - pokemonName
        - rarity
        - condition
        - forSale

    UpdateCardBody:
      type: object
      properties:
        name:
          type: string
        pokemonName:
          type: string
        setName:
          type: string
        cardNumber:
          type: string
        rarity:
          type: string
          enum: [common, uncommon, rare, holo_rare, ultra_rare, secret_rare, promo]
        condition:
          type: string
          enum: [mint, near_mint, excellent, good, light_played, played, poor]
        imageUrl:
          type: string
          nullable: true
        originalScanUrl:
          type: string
          nullable: true
        catalogCardId:
          type: string
          nullable: true
        estimatedValue:
          type: number
          nullable: true
        acquiredDate:
          type: string
          format: date-time
          nullable: true
        categoryId:
          type: integer
          nullable: true
        forSale:
          type: boolean
        listingPrice:
          type: number
          nullable: true
        notes:
          type: string
          nullable: true
        cardStory:
          type: string
          nullable: true

    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        cardCount:
          type: integer
        totalValue:
          type: number
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - cardCount
        - totalValue
        - createdAt

    CreateCategoryBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
      required:
        - name

    UpdateCategoryBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        color:
          type: string
          nullable: true

    Listing:
      type: object
      properties:
        id:
          type: integer
        cardId:
          type: integer
        card:
          $ref: "#/components/schemas/Card"
        price:
          type: number
        status:
          type: string
          enum: [active, sold, cancelled]
        description:
          type: string
          nullable: true
        viewCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - cardId
        - card
        - price
        - status
        - viewCount
        - createdAt
        - updatedAt

    CreateListingBody:
      type: object
      properties:
        cardId:
          type: integer
        price:
          type: number
        description:
          type: string
          nullable: true
      required:
        - cardId
        - price

    UpdateListingBody:
      type: object
      properties:
        price:
          type: number
        status:
          type: string
          enum: [active, sold, cancelled]
        description:
          type: string
          nullable: true

    InventoryStats:
      type: object
      properties:
        totalCards:
          type: integer
        totalValue:
          type: number
        forSaleCount:
          type: integer
        forSaleValue:
          type: number
        totalListings:
          type: integer
        categoryCount:
          type: integer
        rarityBreakdown:
          type: object
          additionalProperties:
            type: integer
        conditionBreakdown:
          type: object
          additionalProperties:
            type: integer
      required:
        - totalCards
        - totalValue
        - forSaleCount
        - forSaleValue
        - totalListings
        - categoryCount
        - rarityBreakdown
        - conditionBreakdown

    CategoryValue:
      type: object
      properties:
        categoryId:
          type: integer
          nullable: true
        categoryName:
          type: string
        cardCount:
          type: integer
        totalValue:
          type: number
      required:
        - categoryName
        - cardCount
        - totalValue

    PokemonResult:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        imageUrl:
          type: string
        setName:
          type: string
        setId:
          type: string
        cardNumber:
          type: string
        rarity:
          type: string
          nullable: true
      required:
        - id
        - name
        - imageUrl
        - setName
        - setId
        - cardNumber

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1

    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
        metadata:
